<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L1. У світі хвостів і лап</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: znohub.junior blue header, then one calm column of rounded light-lilac cards, one task per screen */
:root{
  --blue:#0C00FF;
  --lime:#CBF450;
  --soft:#E2E0FF;
  --mist:#EAF1FD;
  --ink:#0A0A0F;
  --grey:#5B5F73;
  --white:#FFFFFF;
  --bad-bg:#FFE3E6;
  --bad:#C4172F;
  --font:'Google Sans','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--white);color:var(--ink);font-size:18px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button{font-family:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* header */
.hero{background:var(--blue);color:var(--white)}
.hero-in{max-width:900px;margin:0 auto;padding:26px 20px 30px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hero-l{min-width:0}
.logo{height:26px;width:auto;margin-bottom:18px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.badge{font-size:14px;font-weight:500;padding:6px 14px;border-radius:999px;line-height:1.2}
.badge.lime{background:var(--lime);color:var(--blue)}
.badge.white{background:var(--white);color:var(--blue)}
h1{margin:0;font-size:clamp(32px,7vw,56px);line-height:1.08;font-weight:700;letter-spacing:-0.02em;text-wrap:balance}
.arrow{width:clamp(72px,16vw,132px);height:auto;flex:none}

/* page */
main{max-width:900px;margin:0 auto;padding:24px 20px 56px}
.lead{margin:0 0 20px;color:var(--grey);max-width:60ch}
.num{width:36px;height:36px;border-radius:50%;background:var(--blue);color:var(--white);font-weight:600;font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:none}

.progress-card{background:var(--mist);border-radius:22px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:22px}
.progress-card .pc-text{font-weight:600}
.progress-card .pc-text span{color:var(--grey);font-weight:400}
.progress-card .bar{flex:1 1 180px}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--blue);font-weight:500;font-size:16px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mode{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--soft);border:2px solid transparent;border-radius:24px;padding:18px;cursor:pointer;transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--blue);transform:translateY(-2px)}
.mode h2{margin:2px 0 4px;font-size:21px;font-weight:600;line-height:1.2}
.mode p{margin:0;color:var(--grey);font-size:16px;line-height:1.35}
.mode .best{display:inline-block;margin-top:8px;font-size:14px;font-weight:500;background:var(--white);color:var(--blue);padding:3px 10px;border-radius:999px}


/* shared */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.topbar .t{font-weight:600;font-size:20px;flex:1;min-width:0}
.topbar .count{color:var(--grey);font-weight:500;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:18px;font-weight:600;line-height:1;padding:14px 24px;border-radius:999px;border:2px solid var(--blue);background:var(--white);color:var(--blue);cursor:pointer;transition:background .15s,color .15s,transform .1s}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:var(--white)}
.btn.primary:hover{background:#2A1FFF}
.btn.small{font-size:15px;padding:10px 16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
.bar{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:999px;transition:width .3s}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:2px solid var(--soft);background:var(--white);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.chip[disabled]{opacity:.4;cursor:default}
.speak{width:48px;height:48px;border-radius:50%;border:2px solid currentColor;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.speak svg{width:24px;height:24px}
.speak:hover{background:rgba(255,255,255,.18)}

/* flashcards */
.flip{perspective:1400px;width:min(100%,400px);aspect-ratio:1/1.12;margin:0 auto 22px}
.flip-btn{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:28px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.flip.flipped .flip-btn{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.face.front{background:var(--soft)}
.face.front img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:20px;background:var(--white)}
.face.front .hint{color:var(--grey);font-size:15px}
.face.back{background:var(--blue);color:var(--white);transform:rotateY(180deg);text-align:center}
.face.back .w{font-size:clamp(40px,10vw,58px);font-weight:700;letter-spacing:-0.02em;line-height:1.05}
.face.back .u{color:var(--lime);font-size:26px;font-weight:500}
.face.back .speak{color:var(--white)}
.flip-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.flip-actions .btn{min-width:150px}

/* quiz */
.q{background:var(--mist);border-radius:28px;padding:22px}
.q-prompt{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:18px;text-align:center}
.q-prompt img.big{width:min(100%,300px);aspect-ratio:1;object-fit:cover;border-radius:22px;background:var(--white)}
.q-prompt .ask{font-size:22px;font-weight:600}
.q-prompt .word{font-size:clamp(40px,9vw,56px);font-weight:700;color:var(--blue);letter-spacing:-0.02em;line-height:1.05;display:flex;align-items:center;gap:14px;justify-content:center}
.q-prompt .word .speak{color:var(--blue)}
.q-prompt .word .speak:hover{background:var(--soft)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{background:var(--soft);border:3px solid transparent;border-radius:20px;padding:16px 12px;font-size:clamp(19px,4.6vw,24px);font-weight:600;color:var(--blue);cursor:pointer;transition:transform .12s,border-color .12s;min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.opt.pic{padding:6px;min-height:0}
.opt.pic img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15px;background:var(--white)}
.opt:not([disabled]):hover{border-color:var(--blue);transform:translateY(-2px)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--lime);border-color:var(--blue);color:var(--blue)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.55}
.fb{margin-top:16px;border-radius:18px;padding:14px 18px;background:var(--white);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.fb .msg{font-weight:500;flex:1 1 220px}
.fb .msg b{font-weight:700;color:var(--blue)}
.fb.good{background:var(--lime)}
.fb.bad{background:var(--bad-bg)}
.fb .speak{color:var(--blue);width:42px;height:42px}
.fb .speak:hover{background:rgba(12,0,255,.1)}
.next{margin-top:16px;display:flex;justify-content:center}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{aspect-ratio:1;border:3px solid transparent;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:6px;cursor:pointer;font-size:clamp(16px,3.6vw,22px);font-weight:600;color:var(--blue);text-align:center;transition:transform .12s,border-color .12s}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:12px;background:var(--white)}
.tile:not([disabled]):hover{border-color:var(--blue)}
.tile.sel{border-color:var(--blue);background:var(--white);transform:scale(1.03)}
.tile.done{background:var(--lime);border-color:var(--lime);opacity:.65;cursor:default}
.tile.shake{border-color:var(--bad);background:var(--bad-bg);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* result */
.res{background:var(--mist);border-radius:28px;padding:28px 22px;text-align:center}
.res .stars{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.res .stars svg{width:44px;height:44px}
.res .score{font-size:clamp(44px,10vw,64px);font-weight:700;color:var(--blue);line-height:1.05;letter-spacing:-0.02em}
.res .score small{font-size:.4em;color:var(--grey);font-weight:500;letter-spacing:0}
.res .msg{margin:6px auto 18px;max-width:42ch;font-size:20px;font-weight:500}
.miss{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 20px}
.miss span{background:var(--white);color:var(--blue);font-weight:600;border-radius:999px;padding:6px 14px;font-size:16px}
.miss span em{font-style:normal;color:var(--grey);font-weight:400}

@media (max-width:520px){
  body{font-size:17px}
  .modes{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .q{padding:16px}
  .hero-in{padding:20px 16px 24px}
  main{padding:20px 16px 48px}
}
@media (prefers-reduced-motion:reduce){
  .flip-btn,.bar>i,.mode,.opt,.tile{transition:none}
  .tile.shake{animation:none}
}
</style>
</head>

  <div class="hero-in">
    <div class="hero-l">

      <div class="badges"><span class="badge lime">English Core</span><span class="badge white">Vocabulary</span></div>
      <h1>У&nbsp;світі хвостів і&nbsp;лап</h1>
    </div>
    <img class="arrow" id="arrow" alt="">
  </div>
</header>
<main id="app"></main>

const BY=Object.fromEntries(WORDS.map(w=>[w.id,w]));
const app=document.getElementById('app');

/* helpers */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle(a).slice(0,n)}
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const K_KNOWN='znohub-junior-l1-known', K_BEST='znohub-junior-l1-best';
let known=new Set(store.get(K_KNOWN,[]).filter(id=>BY[id]));
const saveKnown=()=>store.set(K_KNOWN,[...known]);
function setBest(mode,score,total){
  const b=store.get(K_BEST,{});
  const prev=b[mode];
  if(!prev||score/total>prev.s/prev.t){b[mode]={s:score,t:total};store.set(K_BEST,b)}
}

const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/></svg>',
  star:(on)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="${on?'#0C00FF':'#E2E0FF'}"/></svg>`
};
const canSpeak='speechSynthesis' in window;
function speak(text){
  try{
    if(!canSpeak)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US';u.rate=.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
const speakBtn=(text,label)=>canSpeak?`<button type="button" class="speak" data-say="${text}" aria-label="${label||'Послухати'}">${ICON.speaker}</button>`:'';
function bindSay(root){
  $$('[data-say]',root).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();speak(b.dataset.say)}));
}
function topbar(title,right){
  return `<div class="topbar"><button type="button" class="btn small" id="toMenu">${ICON.back}Меню</button><div class="t">${title}</div>${right?`<div class="count" id="tcount">${right}</div>`:''}</div>`;
}
function bindMenu(){const b=$('#toMenu');if(b)b.addEventListener('click',()=>{speechCancel();home()})}
function speechCancel(){try{if(canSpeak)speechSynthesis.cancel()}catch(e){}}
function show(html){app.innerHTML=html;window.scrollTo({top:0})}

/* home */
const MODES=[
  {id:'flash',title:'Флешкартки',desc:'Переверни картку, послухай слово й запам’ятай'},
  {id:'photo',title:'Що на фото?',desc:'Подивись на тварину й обери англійське слово'},
  {id:'pic',title:'Знайди картинку',desc:'Прочитай слово й обери правильне фото'},
  {id:'match',title:'Пари',desc:'Поєднай фото зі словом якомога швидше'}
];
function home(){
  const best=store.get(K_BEST,{});
  const n=known.size,total=WORDS.length;
  show(`
    <p class="lead">Вивчи слова з уроку: переверни картки, а потім перевір себе в тестах.</p>
    <div class="progress-card">
      <div class="pc-text">Знаю ${n} з${NB}${total} слів <span>${n===total?'Чудово, усе вивчено!':n?'Так тримати!':'Почни з флешкарток'}</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${n}"><i style="width:${n/total*100}%"></i></div>
      ${n?'<button type="button" class="linkbtn" id="reset">Почати спочатку</button>':''}
    </div>
    <div class="modes">
      ${MODES.map((m,i)=>{
        const b=best[m.id];
        return `<button type="button" class="mode" data-mode="${m.id}">
          <span class="num">${i+1}</span>
          <span><h2>${m.title}</h2><p>${m.desc}</p>${b?`<span class="best">${m.id==='match'?`Найкращий результат: ${b.s} з${NB}3 зірок`:`Найкращий результат: ${b.s} з${NB}${b.t}`}</span>`:''}</span>
        </button>`}).join('')}
    </div>`);
  $$('[data-mode]').forEach(b=>b.addEventListener('click',()=>start(b.dataset.mode)));
  const r=$('#reset');
  if(r)r.addEventListener('click',()=>{known=new Set();saveKnown();store.set(K_BEST,{});home()});
}
function start(mode){
  ({flash:flashcards,photo:()=>runQuiz(photoQuiz()),pic:()=>runQuiz(picQuiz()),match:matchGame})[mode]();
}

/* flashcards */
function flashcards(filter='all',idsOverride){
  const decks={
    all:{label:'Усі слова',ids:WORDS.map(w=>w.id)},
    a:{label:'Тварини',ids:WORDS.filter(w=>w.t==='a').map(w=>w.id)},
    b:{label:'Частини тіла',ids:WORDS.filter(w=>w.t==='b').map(w=>w.id)},
    learn:{label:'Ще вчу',ids:WORDS.filter(w=>!known.has(w.id)).map(w=>w.id)}
  };
  const ids=idsOverride||shuffle(decks[filter].ids);
  let i=0;const again=[];let gotIt=0;
  const chips=()=>`<div class="chips" role="group" aria-label="Набір карток">${Object.entries(decks).map(([k,d])=>`<button type="button" class="chip" data-deck="${k}" aria-pressed="${!idsOverride&&k===filter}"${d.ids.length?'':' disabled'}>${d.label} · ${d.ids.length}</button>`).join('')}</div>`;
  function card(){
    if(i>=ids.length)return done();
    const w=BY[ids[i]];
    show(`
      ${topbar('Флешкартки',`${i+1} з${NB}${ids.length}`)}
      ${i===0?chips():''}
      <div class="bar" style="margin-bottom:20px"><i style="width:${i/ids.length*100}%"></i></div>
      <div class="flip" id="flip">
        <div class="flip-btn" id="flipBtn" role="button" tabindex="0" aria-label="Перевернути картку">
          <div class="face front"><img src="${IMG[w.id]}" alt=""><span class="hint">Натисни, щоб перевернути</span></div>
          <div class="face back"><div class="w">${w.en}</div><div class="u">${w.uk}</div>${speakBtn(w.en,'Послухати слово '+w.en)}</div>
        </div>
      </div>
      <div class="flip-actions">
        <button type="button" class="btn" id="learn">Ще вчу</button>
        <button type="button" class="btn primary" id="know">Знаю</button>
      </div>`);
    bindMenu();bindSay(app);
    const flipIt=()=>{
      const f=$('#flip');f.classList.toggle('flipped');
      if(f.classList.contains('flipped'))speak(w.en);
    };
    $('#flipBtn').addEventListener('click',flipIt);
    $('#flipBtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flipIt()}});
    $('#know').addEventListener('click',()=>{known.add(w.id);saveKnown();gotIt++;i++;card()});
    $('#learn').addEventListener('click',()=>{known.delete(w.id);saveKnown();again.push(w.id);i++;card()});
    $$('[data-deck]').forEach(c=>c.addEventListener('click',()=>flashcards(c.dataset.deck)));
  }
  function done(){
    show(`
      ${topbar('Флешкартки')}
      <div class="res">
        <div class="score">${gotIt}<small> з${NB}${ids.length}</small></div>
        <p class="msg">${again.length?`Слів, які ще вчиш: ${again.length}. Повтори їх ще раз!`:'Усі слова з цього набору вже знаєш!'}</p>
        ${again.length?`<div class="miss">${again.map(id=>`<span>${BY[id].en} <em>${BY[id].uk}</em></span>`).join('')}</div>`:''}
        <div class="row">
          ${again.length?'<button type="button" class="btn primary" id="rep">Повторити ці слова</button>':'<button type="button" class="btn primary" id="tests">До тестів</button>'}
          <button type="button" class="btn" id="again">Почати знову</button>
        </div>
      </div>`);
    bindMenu();
    const rep=$('#rep');if(rep)rep.addEventListener('click',()=>flashcards('all',shuffle(again)));
    const t=$('#tests');if(t)t.addEventListener('click',home);
    $('#again').addEventListener('click',()=>flashcards('all'));
  }
  card();
}

/* quiz engine */
function distractors(w,n,from){
  const pool=WORDS.filter(x=>x.id!==w.id);
  const same=shuffle(pool.filter(x=>x.t===w.t));
  const other=shuffle(pool.filter(x=>x.t!==w.t));
  return [...same,...other].slice(0,n);
}
function photoQuiz(){
  const qs=sample(WORDS,10).map(w=>({
    id:w.id,
    prompt:`<img class="big" src="${IMG[w.id]}" alt=""><div class="ask">Що на фото?</div>`,
    opts:shuffle([w,...distractors(w,3)]).map(x=>({html:x.en,ok:x.id===w.id})),
    said:w.en,
    good:`Правильно! <b>${w.en}</b> — ${w.uk}`,
    bad:`Це <b>${w.en}</b> — ${w.uk}`
  }));
  return {mode:'photo',title:'Що на фото?',qs};
}
function picQuiz(){
  const qs=sample(WORDS,10).map(w=>({
    id:w.id,
    prompt:`<div class="ask">Знайди на фото</div><div class="word">${w.en}${speakBtn(w.en,'Послухати слово '+w.en)}</div>`,
    opts:shuffle([w,...distractors(w,3)]).map(x=>({html:`<img src="${IMG[x.id]}" alt="">`,pic:true,ok:x.id===w.id})),
    said:w.en,
    good:`Правильно! <b>${w.en}</b> — ${w.uk}`,
    bad:`Правильне фото підсвічено: <b>${w.en}</b> — ${w.uk}`,
    grid:true
  }));
  return {mode:'pic',title:'Знайди картинку',qs};
}
function runQuiz(cfg,isRetry){
  const qs=cfg.qs;let i=0,score=0;const missed=[];
  function render(){
    const q=qs[i];
    const optsHtml=q.opts.map((o,k)=>`<button type="button" class="opt${o.pic?' pic':''}" data-k="${k}"${o.pic?` aria-label="Варіант ${k+1}"`:''}>${o.html}</button>`).join('');
    show(`
      ${topbar(cfg.title+(isRetry?' · помилки':''),`${i+1} з${NB}${qs.length}`)}
      <div class="bar" style="margin-bottom:18px"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="q">
        <div class="q-prompt">${q.prompt}</div>
        <div class="opts" id="opts">${optsHtml}</div>
        <div id="after"></div>
      </div>`);
    bindMenu();bindSay(app);
    $$('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.k)));
  }
  function answer(k){
    const q=qs[i];const o=q.opts[k];
    $$('.opt').forEach((b,n)=>{
      b.disabled=true;
      if(q.opts[n].ok)b.classList.add('ok');
      else if(n===k)b.classList.add('no');
      else b.classList.add('dim');
    });
    if(o.ok)score++;else{missed.push(q);if(BY[q.id]&&known.has(q.id)){known.delete(q.id);saveKnown()}}
    const last=i===qs.length-1;
    $('#after').innerHTML=`
      <div class="fb ${o.ok?'good':'bad'}" role="status">
        <div class="msg">${o.ok?q.good:'Не зовсім. '+q.bad}</div>
        ${q.said?speakBtn(q.said,'Послухати слово '+q.said):''}
      </div>
      <div class="next"><button type="button" class="btn primary" id="nx">${last?'Дивитись результат':'Далі'}</button></div>`;
    bindSay($('#after'));
    if(o.ok&&q.said)speak(q.said);
    const nx=$('#nx');nx.focus({preventScroll:false});
    nx.addEventListener('click',()=>{i++;i<qs.length?render():finish()});
  }
  function finish(){
    if(!isRetry)setBest(cfg.mode,score,qs.length);
    const pct=score/qs.length;
    const stars=pct===1?3:pct>=.7?2:pct>=.4?1:0;
    const msg=pct===1?'Без жодної помилки!':pct>=.7?'Дуже добре! Повтори помилки, і наступного разу буде без жодної':pct>=.4?'Непогано! Повтори помилки й спробуй ще раз':'Це лише початок. Повтори картки й спробуй ще раз';
    show(`
      ${topbar(cfg.title)}
      <div class="res">
        <div class="stars" aria-label="${stars} з 3 зірок">${[0,1,2].map(n=>ICON.star(n<stars)).join('')}</div>
        <div class="score">${score}<small> з${NB}${qs.length}</small></div>
        <p class="msg">${msg}</p>
        ${missed.length?`<div class="miss">${missed.map(q=>{const w=BY[q.id];return `<span>${w.en} <em>${w.uk}</em></span>`}).join('')}</div>`:''}
        <div class="row">
          ${missed.length?'<button type="button" class="btn primary" id="retry">Повторити помилки</button>':''}
          <button type="button" class="btn${missed.length?'':' primary'}" id="again">Пройти ще раз</button>
          <button type="button" class="btn" id="menu2">До меню</button>
        </div>
      </div>`);
    bindMenu();
    const r=$('#retry');
    if(r)r.addEventListener('click',()=>runQuiz({...cfg,qs:shuffle(missed.map(q=>({...q,opts:shuffle(q.opts)})))},true));
    $('#again').addEventListener('click',()=>start(cfg.mode));
    $('#menu2').addEventListener('click',home);
  }
  render();
}

/* match */
function matchGame(){
  const picked=sample(WORDS,6);
  const tiles=shuffle(picked.flatMap(w=>[{id:w.id,kind:'img'},{id:w.id,kind:'txt'}]));
  let sel=null,tries=0,found=0,lock=false;
  function draw(){
    show(`
      ${topbar('Пари',`Знайдено ${found} з${NB}6`)}
      <div class="bar" style="margin-bottom:18px"><i style="width:${found/6*100}%"></i></div>
      <div class="q"><p style="margin:0 0 14px;text-align:center;font-weight:500">Поєднай фото зі словом</p>
        <div class="mgrid" id="g">
          ${tiles.map((t,k)=>`<button type="button" class="tile" data-k="${k}"${t.kind==='img'?' aria-label="Фото"':''}>${t.kind==='img'?`<img src="${IMG[t.id]}" alt="">`:BY[t.id].en}</button>`).join('')}
        </div>
      </div>`);
    bindMenu();
    $$('.tile').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.k)));
  }
  function pick(k){
    if(lock)return;
    const t=tiles[k],el=$(`[data-k="${k}"]`);
    if(t.done)return;
    if(sel===null){sel=k;el.classList.add('sel');if(t.kind==='txt')speak(BY[t.id].en);return}
    if(sel===k){sel=null;el.classList.remove('sel');return}
    const a=tiles[sel],ae=$(`[data-k="${sel}"]`);
    tries++;
    if(a.id===t.id&&a.kind!==t.kind){
      a.done=t.done=true;found++;
      ae.classList.remove('sel');ae.classList.add('done');el.classList.add('done');
      ae.disabled=el.disabled=true;sel=null;
      speak(BY[t.id].en);
      $('#tcount').textContent=`Знайдено ${found} з${NB}6`;
      $('.bar>i').style.width=found/6*100+'%';
      if(found===6)setTimeout(finish,700);
    }else{
      lock=true;
      el.classList.add('shake');ae.classList.add('shake');ae.classList.remove('sel');
      setTimeout(()=>{el.classList.remove('shake');ae.classList.remove('shake');sel=null;lock=false},450);
    }
  }
  function finish(){
    const miss=tries-6;
    const stars=miss===0?3:miss<=3?2:1;
    const plural=n=>{const a=n%10,b=n%100;return a===1&&b!==11?'спроба':(a>=2&&a<=4&&(b<10||b>=20))?'спроби':'спроб'};
    setBest('match',stars,3);
    show(`
      ${topbar('Пари')}
      <div class="res">
        <div class="stars" aria-label="${stars} з 3 зірок">${[0,1,2].map(n=>ICON.star(n<stars)).join('')}</div>
        <div class="score">${tries}<small> ${plural(tries)}</small></div>
        <p class="msg">${miss===0?'Без жодної помилки!':miss<=3?'Дуже добре! Спробуй ще раз, щоб не помилитись жодного разу':'Усі пари знайдено! Спробуй ще раз, щоб помилятися менше'}</p>
        <div class="row">
          <button type="button" class="btn primary" id="again">Грати ще раз</button>
          <button type="button" class="btn" id="menu2">До меню</button>
        </div>
      </div>`);
    bindMenu();
    $('#again').addEventListener('click',matchGame);
    $('#menu2').addEventListener('click',home);
  }
  draw();
}

home();
</script>
